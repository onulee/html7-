<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <title>학생성적프로그램</title>
    <style>
        table,th,td{border:1px solid black; border-collapse: collapse;}
        th,td{width:100px; height:40px; text-align: center; }
    </style>
    <script>
        //자바스크립트 구문이 너무 길고, 어려움.
        // 쉽게 하기 위해서 제이쿼리사용
        //stus.json 파일을 ajax연결
        $(function(){
            $("#takeBtn").click(function(){
                //alert("확인")
                $.ajax({
                    url:"stus.json",          //연결할 주소
                    type:"get",      //전송방식-get,post
                    dataType:"json", //전송받을 타입-text,html,json,xml
                    data:{},         //보낼데이터
                    success:function(data){  //성공시
                        alert("성공");
                        console.log(data);
                        // `` :자바스크립트 변수를 추가할수 있음. ${변수}
                        let dataHtml = ``;
                        //10번반복
                        for(let i=0;i<10;i++){
                            dataHtml += `
                            <tr>
                                <td>${data[i].sno}</td>
                                <td>${data[i].name}</td>
                                <td>${data[i].kor}</td>
                                <td>${data[i].eng}</td>
                                <td>${data[i].math}</td>
                                <td>${data[i].total}</td>
                                <td>${data[i].avg}</td>
                                <td>
    
                                </td>
                            </tr>    
                            `;
                        }//for

                        $("#tbody").html(dataHtml); //append,prepend,html
                    },
                    error:function(){ //실패시
                        alert("실패");
                    }
                });//ajax
            });//click
        });//jquery구문

            
    </script>
</head>
<body>
    <button type="button" id="takeBtn">데이터 가져오기</button>
    <form action="#" method="get">
        <label>번호</label>
        <input type="text" id="sno" name="sno"><br>
        <label>이름</label>
        <input type="text" id="name" name="name"><br>
        <label>국어</label>
        <input type="text" id="kor" name="kor"><br>
        <label>영어</label>
        <input type="text" id="eng" name="eng"><br>
        <label>수학</label>
        <input type="text" id="math" name="math" onkeyup="enterBtn(event)" ><br>
        <button type="button" id="sbtn" onclick="saveBtn()" >성적저장</button>
    </form>
    <table>
        <tr>
            <th>번호</th>
            <th>이름</th>
            <th>국어</th>
            <th>영어</th>
            <th>수학</th>
            <th>합계</th>
            <th>평균</th>
            <th>비고</th>
        </tr>
        <tbody id="tbody">
           
            
        </tbody>

    </table>
   
   
</body>
</html>
